{% extends "base.html" %}{% block content %}
<div class="page-heading"><h1>Mon compte</h1></div><div class="panel form-panel"><h2>Modifier le mot de passe</h2>
<form method="post"><input type="hidden" name="_csrf" value="{{csrf()}}">
<label>Mot de passe actuel<input name="old" type="password" required autocomplete="current-password"></label>
<label>Nouveau mot de passe (12 caractères min.)<input name="new" type="password" required minlength="12" autocomplete="new-password"></label>
<button class="btn primary">Enregistrer</button></form></div>
{% endblock %}
