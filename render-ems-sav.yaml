services:
  - type: web
    name: ems-sav-tamatave
    runtime: python
    plan: free
    region: frankfurt
    branch: ems-sav-independant
    rootDir: sav_ems
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 90
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: SETUP_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ems-sav-db
          property: connectionString
databases:
  - name: ems-sav-db
    plan: free
    region: frankfurt
